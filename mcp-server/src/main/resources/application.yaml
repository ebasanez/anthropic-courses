# MCP server: publishes this project's tools over streamable HTTP.
# Owns no model and no database of its own.

server:
  port: 8082

spring:
  application:
    name: mcp-server
  # No autoconfigure excludes and no spring.ai.model.*=none guards: this module's pom
  # declares only the MCP starter, so no datasource, vector store, chat model or
  # embedding model autoconfiguration is on the classpath to begin with.
  ai:
    mcp:
      server:
        name: anthropic-courses-tools
        version: 0.0.1
        protocol: streamable             # streamable HTTP transport at /mcp
        instructions: >
          Utility tools exposed by the anthropic-courses project. Currently: add, which
          returns the sum of two numbers. Resources publish this module's documents
          (src/main/resources/docs): read docs://mcp-server for the list of document
          URIs, then read one of them for its contents.
        streamable-http:
          mcp-endpoint: /mcp
